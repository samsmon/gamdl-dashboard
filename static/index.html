<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gamdl dashboard</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="toolbar" id="toolbar"></header>
  <div id="banner" role="status" aria-live="polite" hidden></div>
  <div class="workspace">
    <aside class="sidebar" id="sidebar" aria-label="filters"></aside>
    <div class="pane">
      <div class="qhead" id="qhead"></div>
      <div class="tablewrap" id="tablewrap">
        <table id="grid">
          <thead><tr>
            <th class="c-n">#</th><th class="c-name">Name</th><th class="c-status">Status</th><th class="c-prog">Progress</th>
            <th class="c-tracks">Tracks</th><th class="c-speed">Speed</th><th class="c-delay">Delay</th><th class="c-size">Size</th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <p id="empty" class="empty" hidden></p>
      </div>
      <div class="resizer" id="resizer" role="separator" aria-orientation="horizontal" title="drag to resize"></div>
      <section class="detail" id="detail" aria-label="details">
        <div class="dtabs" id="dtabs"></div>
        <div class="dbody" id="dbody" tabindex="0"></div>
      </section>
    </div>
    <section class="relpane" id="relpane" aria-label="releases" hidden></section>
  </div>
  <footer class="statusbar" id="statusbar"></footer>
</div>
<div id="ctx" class="ctx" role="menu" hidden></div>
<div id="modal-root"></div>
<div id="status-msg" role="status" aria-live="polite" hidden></div>
<script src="app.js"></script>
</body>
</html>
